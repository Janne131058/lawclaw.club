<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LawClaw — ask for a lawyer without giving up your name">
  <defs>
    <radialGradient id="bg" cx="78%" cy="-5%" r="90%">
      <stop offset="0%" stop-color="#1d335f"/>
      <stop offset="55%" stop-color="#0e1b3a"/>
      <stop offset="100%" stop-color="#0b1428"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- big claw watermark -->
  <g transform="translate(995,315) rotate(-8)" fill="#c9a24b" fill-opacity="0.16">
    <g transform="rotate(-13)"><path d="M-22,-150 C14,-40 26,40 0,150 C-16,40 -50,-40 -22,-150 Z"/></g>
    <path d="M-22,-150 C14,-40 26,40 0,150 C-16,40 -50,-40 -22,-150 Z"/>
    <g transform="rotate(13)"><path d="M-22,-150 C14,-40 26,40 0,150 C-16,40 -50,-40 -22,-150 Z"/></g>
  </g>

  <!-- brand -->
  <g transform="translate(90,96)" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <g transform="translate(0,-26)">
      <g transform="rotate(-13)"><path d="M-5,-22 C3,-7 5,7 0,24 C-3,7 -9,-7 -5,-22 Z" fill="#c9a24b"/></g>
      <path d="M-5,-22 C3,-7 5,7 0,24 C-3,7 -9,-7 -5,-22 Z" fill="#a9842f"/>
      <g transform="rotate(13)"><path d="M-5,-22 C3,-7 5,7 0,24 C-3,7 -9,-7 -5,-22 Z" fill="#c9a24b"/></g>
    </g>
    <text x="34" y="0" font-size="40" font-weight="700"><tspan fill="#ffffff">Law</tspan><tspan fill="#c9a24b">Claw</tspan></text>
  </g>

  <!-- headline -->
  <text x="90" y="290" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Ask for a lawyer</text>
  <text x="90" y="378" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">without giving up your name.</text>

  <!-- subtitle -->
  <text x="92" y="448" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="30" fill="#c7d2ec">Post anonymously · Bar-verified attorneys come to you · 中英双语</text>

  <!-- pills -->
  <g font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="24" fill="#dbe4f7">
    <rect x="90" y="505" width="240" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="120" y="541">🔒 Anonymous</text>
    <rect x="350" y="505" width="290" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="380" y="541">✅ Bar-verified</text>
    <rect x="660" y="505" width="230" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="690" y="541">🆓 Free for clients</text>
  </g>
</svg>
